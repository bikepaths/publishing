


មនុស្សជោគជ័យក្នុងសង្គមមានតិចតួចណាស់ ព្រោះជ័យជំនះជារឿងកម្រ។ ប៉ុន្តែអ្វីដែលកម្រជាងនេះទៅទៀត គឺមនុស្សដែលអាចស៊ូទ្រាំនឹងការបរាជ័យជាច្រើនលើកច្រើនសារ ហើយនៅតែបន្តតស៊ូ និងជឿជាក់លើគោលដៅរបស់ខ្លួន។ ព្រោះនៅទីបំផុត ជ័យជំនះមិនមែនជារបស់អ្នកដែលមានទេពកោសល្យបំផុតនោះទេ ប៉ុន្តែជារបស់អ្នកដែលមិនបោះបង់។

